<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Map Prototype - Phase 3</title>

  <!-- D3.js v7 -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- TopoJSON -->
  <script src="https://unpkg.com/topojson@3"></script>

  <style>
    /* 기본 리셋 및 레이아웃 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fa;
      color: #2d3748;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-theme {
      background: #1a202c;
      color: #e2e8f0;
    }

    #container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    body.dark-theme header {
      background: #2d3748;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #2d3748;
    }

    body.dark-theme h1 {
      color: #e2e8f0;
    }

    #theme-toggle {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: white;
      background: #3182ce;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #theme-toggle:hover {
      background: #2c5aa0;
    }

    body.dark-theme #theme-toggle {
      background: #63b3ed;
      color: #1a202c;
    }

    body.dark-theme #theme-toggle:hover {
      background: #4299e1;
    }

    #map-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    body.dark-theme #map-container {
      background: #2d3748;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    svg {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* 지도 스타일 */
    .country {
      fill: #e2e8f0;
      stroke: #cbd5e0;
      stroke-width: 0.5;
      transition: fill 0.2s;
      cursor: pointer;
    }

    .country:hover {
      fill: #cbd5e0;
    }

    body.dark-theme .country {
      fill: #4a5568;
      stroke: #2d3748;
    }

    body.dark-theme .country:hover {
      fill: #5a6c7d;
    }

    /* 도시 마커 스타일 */
    .city-marker {
      stroke: white;
      stroke-width: 2;
      cursor: pointer;
      transition: r 0.2s;
    }

    .city-marker:hover {
      r: 7 !important;
    }

    body.dark-theme .city-marker {
      stroke: #1a202c;
    }

    /* 도시 라벨 */
    .city-label {
      font-size: 12px;
      font-weight: 600;
      fill: #2d3748;
      pointer-events: none;
      text-anchor: middle;
    }

    body.dark-theme .city-label {
      fill: #e2e8f0;
    }

    /* 화살표 스타일 - 지역별 색상 */
    .flow-arrow {
      fill: none;
      opacity: 0.7;
      stroke-dasharray: 5, 5;
      animation: dash 20s linear infinite;
      cursor: pointer;
      pointer-events: stroke;
    }

    .flow-arrow:hover {
      opacity: 1 !important;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }

    /* 툴팁 */
    .tooltip {
      position: absolute;
      padding: 8px 12px;
      background: rgba(45, 55, 72, 0.95);
      color: white;
      border-radius: 6px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 1000;
    }

    body.dark-theme .tooltip {
      background: rgba(226, 232, 240, 0.95);
      color: #1a202c;
    }

    /* SVG 내부 범례 */
    .legend-box {
      fill: white;
      fill-opacity: 0.95;
      stroke: #cbd5e0;
      stroke-width: 1;
      rx: 8;
    }

    body.dark-theme .legend-box {
      fill: #2d3748;
      fill-opacity: 0.95;
      stroke: #4a5568;
    }

    .legend-text {
      font-size: 11px;
      fill: #2d3748;
      font-weight: 500;
    }

    body.dark-theme .legend-text {
      fill: #e2e8f0;
    }

    .legend-title {
      font-size: 12px;
      font-weight: 700;
      fill: #2d3748;
    }

    body.dark-theme .legend-title {
      fill: #e2e8f0;
    }

    /* 로딩 표시 */
    #loading {
      text-align: center;
      padding: 40px;
      color: #718096;
    }

    body.dark-theme #loading {
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div id="container">
    <header>
      <h1>세계지도 + M2 유동성 시각화 - Phase 3</h1>
      <button id="theme-toggle">🌙 Dark Mode</button>
    </header>

    <div id="map-container">
      <div id="loading">세계지도 로딩 중...</div>
    </div>
  </div>

  <!-- 툴팁 -->
  <div class="tooltip" id="tooltip"></div>

  <script>
    // 주요 도시 데이터
    const cities = [
      {
        name: "New York",
        coords: [-74.006, 40.7128],
        role: "Federal Reserve",
        region: "Americas",
        country: "USA"
      },
      {
        name: "London",
        coords: [-0.1276, 51.5074],
        role: "Bank of England",
        region: "Europe",
        country: "UK"
      },
      {
        name: "Frankfurt",
        coords: [8.6821, 50.1109],
        role: "ECB",
        region: "Europe",
        country: "EU"
      },
      {
        name: "Beijing",
        coords: [116.4074, 39.9042],
        role: "PBOC",
        region: "Asia",
        country: "China"
      },
      {
        name: "Tokyo",
        coords: [139.6917, 35.6895],
        role: "Bank of Japan",
        region: "Asia",
        country: "Japan"
      },
      {
        name: "Seoul",
        coords: [126.9780, 37.5665],
        role: "Bank of Korea",
        region: "Asia",
        country: "Korea"
      }
    ];

    // Phase 3: M2 Mock 데이터 (연간 변화율 %)
    const m2Data = {
      "USA": { value: 2850, change: 5.2, trend: "increasing" },
      "UK": { value: 520, change: 3.8, trend: "stable" },
      "EU": { value: 1420, change: 4.1, trend: "increasing" },
      "China": { value: 3650, change: 8.5, trend: "increasing" },
      "Japan": { value: 1180, change: 2.1, trend: "stable" },
      "Korea": { value: 385, change: 6.3, trend: "increasing" }
    };

    // 국가별 색상 매핑
    const countryColors = {
      "USA": "#f56565",      // 빨강
      "UK": "#f59e42",       // 주황
      "EU": "#48bb78",       // 녹색
      "China": "#ecc94b",    // 노랑
      "Japan": "#4299e1",    // 파랑
      "Korea": "#9f7aea"     // 보라
    };

    const countryColorsDark = {
      "USA": "#fc8181",
      "UK": "#fbb360",
      "EU": "#68d391",
      "China": "#f6e05e",
      "Japan": "#63b3ed",
      "Korea": "#b794f4"
    };

    // M2 변화율 기반 자금 흐름 계산
    const calculateFlows = () => {
      const flows = [];

      // 주요 자금 흐름 경로 정의
      const flowPairs = [
        { from: "New York", to: "London" },
        { from: "London", to: "Frankfurt" },
        { from: "Frankfurt", to: "Beijing" },
        { from: "Beijing", to: "Tokyo" },
        { from: "Tokyo", to: "Seoul" },
        { from: "Seoul", to: "Tokyo" },
        { from: "London", to: "New York" },
        { from: "Beijing", to: "London" },
        { from: "Tokyo", to: "New York" }
      ];

      // 양방향 경로 체크를 위한 맵
      const pathMap = new Map();

      flowPairs.forEach(pair => {
        const fromCity = cities.find(c => c.name === pair.from);
        const toCity = cities.find(c => c.name === pair.to);

        if (fromCity && toCity) {
          const fromM2 = m2Data[fromCity.country];
          const toM2 = m2Data[toCity.country];

          // M2 변화율 차이로 자금 흐름 강도 계산
          const flowIntensity = Math.abs(fromM2.change - toM2.change);

          // 실제 추정 자금 이동 규모 (억 달러 단위)
          const estimatedAmount = (fromM2.value * flowIntensity / 100);

          // 양방향 체크 (겹침 방지용)
          const pathKey1 = `${pair.from}-${pair.to}`;
          const pathKey2 = `${pair.to}-${pair.from}`;
          let curveDirection = 1; // 기본 위쪽 곡선

          if (pathMap.has(pathKey2)) {
            // 반대 방향 경로가 이미 있으면 아래쪽으로 휘게
            curveDirection = -1;
          }
          pathMap.set(pathKey1, true);

          flows.push({
            from: pair.from,
            to: pair.to,
            fromCountry: fromCity.country,
            toCountry: toCity.country,
            fromM2Change: fromM2.change,
            toM2Change: toM2.change,
            intensity: flowIntensity,
            amount: estimatedAmount, // 추정 자금 이동액 ($B)
            volume: flowIntensity > 4 ? "high" : flowIntensity > 2 ? "medium" : "low",
            curveDirection: curveDirection // 곡선 방향 (1: 위, -1: 아래)
          });
        }
      });

      return flows;
    };

    const flows = calculateFlows();

    // SVG 설정 (세로 크기 2/3로 축소)
    const width = 1200;
    const height = 400;

    // Mercator 투영법 - 6개 금융 중심지가 보이도록 조정
    const projection = d3.geoMercator()
      .center([40, 40])
      .scale(220)
      .translate([width / 2, height / 2]);

    const path = d3.geoPath().projection(projection);

    // 툴팁 요소
    const tooltip = d3.select("#tooltip");

    // 지도 데이터 로드 및 렌더링
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then(data => {
        // 로딩 메시지 제거
        d3.select("#loading").remove();

        // SVG 생성
        const svg = d3.select("#map-container")
          .append("svg")
          .attr("width", width)
          .attr("height", height)
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("preserveAspectRatio", "xMidYMid meet");

        // 화살표 마커 정의 - 국가별로 여러 개
        const defs = svg.append("defs");

        Object.keys(countryColors).forEach(country => {
          const color = countryColors[country];
          defs.append("marker")
            .attr("id", `arrowhead-${country}`)
            .attr("viewBox", "0 -5 10 10")
            .attr("refX", 8)
            .attr("refY", 0)
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("orient", "auto")
            .append("path")
            .attr("d", "M0,-5L10,0L0,5")
            .attr("fill", color);
        });

        // TopoJSON을 GeoJSON으로 변환
        const countries = topojson.feature(data, data.objects.countries);

        // 국가 이름 매핑 (TopoJSON 국가명 -> 우리 시스템 국가 코드)
        const countryNameMap = {
          "United States of America": "USA",
          "United Kingdom": "UK",
          "Germany": "EU",
          "China": "China",
          "Japan": "Japan",
          "South Korea": "Korea"
        };

        // 국가별 자금 흐름 정보 계산
        const getCountryFlowInfo = (countryCode) => {
          if (!countryCode) return null;

          const outflows = flows.filter(f => f.fromCountry === countryCode);
          const inflows = flows.filter(f => f.toCountry === countryCode);

          return { outflows, inflows };
        };

        // 국가 경계선 그리기
        svg.append("g")
          .selectAll("path")
          .data(countries.features)
          .enter()
          .append("path")
          .attr("class", "country")
          .attr("d", path)
          .on("mouseover", function(event, d) {
            const countryName = d.properties.name || "Unknown";
            const countryCode = countryNameMap[countryName];

            let tooltipContent = `<strong>${countryName}</strong>`;

            if (countryCode) {
              const flowInfo = getCountryFlowInfo(countryCode);
              const m2Info = m2Data[countryCode];

              tooltipContent += `<br/>M2: $${m2Info.value}B (${m2Info.change > 0 ? '+' : ''}${m2Info.change}%)`;

              if (flowInfo.outflows.length > 0) {
                tooltipContent += `<br/><br/><strong>자금 유출:</strong>`;
                flowInfo.outflows.forEach(flow => {
                  const amount = (m2Info.value * flow.intensity / 100).toFixed(0);
                  tooltipContent += `<br/>→ ${flow.to}: ~$${amount}B`;
                });
              }

              if (flowInfo.inflows.length > 0) {
                tooltipContent += `<br/><br/><strong>자금 유입:</strong>`;
                flowInfo.inflows.forEach(flow => {
                  const fromM2 = m2Data[flow.fromCountry];
                  const amount = (fromM2.value * flow.intensity / 100).toFixed(0);
                  tooltipContent += `<br/>← ${flow.from}: ~$${amount}B`;
                });
              }
            }

            tooltip
              .style("opacity", 0.9)
              .html(tooltipContent)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", function() {
            tooltip.style("opacity", 0);
          });

        // 화살표 그리기
        const arrowsGroup = svg.append("g").attr("class", "arrows");

        // 도시 이름으로 좌표 찾기
        const getCityCoords = (cityName) => {
          const city = cities.find(c => c.name === cityName);
          return city ? city.coords : null;
        };

        // 베지어 곡선 경로 생성 (겹침 방지를 위한 방향 파라미터 추가)
        const createCurvedPath = (from, to, direction = 1) => {
          const source = projection(from);
          const target = projection(to);

          const dx = target[0] - source[0];
          const dy = target[1] - source[1];
          const dr = Math.sqrt(dx * dx + dy * dy);

          const curvature = 0.3 * direction; // direction: 1 (위로) 또는 -1 (아래로)
          const controlX = (source[0] + target[0]) / 2;
          const controlY = (source[1] + target[1]) / 2 - dr * curvature;

          return `M ${source[0]},${source[1]} Q ${controlX},${controlY} ${target[0]},${target[1]}`;
        };

        // 화살표 굵기 계산 (자금 규모 기반)
        const getStrokeWidth = (amount) => {
          // amount는 $B 단위
          if (amount > 200) return 5;      // $200B 이상: 매우 굵게
          if (amount > 100) return 4;      // $100-200B: 굵게
          if (amount > 50) return 3;       // $50-100B: 중간
          if (amount > 20) return 2.5;     // $20-50B: 약간 굵게
          return 2;                        // $20B 이하: 기본
        };

        // 화살표 그리기
        flows.forEach(flow => {
          const fromCoords = getCityCoords(flow.from);
          const toCoords = getCityCoords(flow.to);

          if (fromCoords && toCoords) {
            const strokeWidth = getStrokeWidth(flow.amount);
            const color = countryColors[flow.fromCountry]; // 출발 국가 색상 사용

            const arrow = arrowsGroup.append("path")
              .attr("class", "flow-arrow")
              .attr("d", createCurvedPath(fromCoords, toCoords, flow.curveDirection)) // 겹침 방지
              .attr("marker-end", `url(#arrowhead-${flow.fromCountry})`) // 출발 국가 마커 사용
              .attr("stroke", color)
              .attr("stroke-width", strokeWidth)
              .style("stroke", color)  // inline style로 강제 적용
              .on("mouseover", function(event) {
                d3.select(this).style("opacity", "1");
                tooltip
                  .style("opacity", 0.9)
                  .html(`
                    <strong>자금 흐름</strong><br/>
                    ${flow.from} → ${flow.to}<br/>
                    추정 규모: ~$${flow.amount.toFixed(0)}B<br/>
                    M2 변화율: ${flow.fromM2Change}% → ${flow.toM2Change}%<br/>
                    <em>강도: ${flow.volume} (Δ${flow.intensity.toFixed(1)}%)</em>
                  `)
                  .style("left", (event.pageX + 10) + "px")
                  .style("top", (event.pageY - 28) + "px");
              })
              .on("mouseout", function() {
                d3.select(this).style("opacity", "0.7");
                tooltip.style("opacity", 0);
              });
          }
        });

        // 도시 마커 그룹
        const markersGroup = svg.append("g").attr("class", "markers");

        // 도시 마커 추가
        markersGroup.selectAll("circle")
          .data(cities)
          .enter()
          .append("circle")
          .attr("class", "city-marker")
          .attr("cx", d => projection(d.coords)[0])
          .attr("cy", d => projection(d.coords)[1])
          .attr("r", 5)
          .attr("fill", d => countryColors[d.country]) // 국가별 색상 사용
          .on("mouseover", function(event, d) {
            const m2Info = m2Data[d.country];
            tooltip
              .style("opacity", 0.9)
              .html(`
                <strong>${d.name}</strong><br/>
                ${d.role}<br/>
                M2: $${m2Info.value}B (${m2Info.change > 0 ? '+' : ''}${m2Info.change}%)<br/>
                <em>${d.country}</em>
              `)
              .style("left", (event.pageX + 10) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", function() {
            tooltip.style("opacity", 0);
          });

        // 도시 라벨
        markersGroup.selectAll("text")
          .data(cities)
          .enter()
          .append("text")
          .attr("class", "city-label")
          .attr("x", d => projection(d.coords)[0])
          .attr("y", d => projection(d.coords)[1] - 10)
          .text(d => d.name);

        // SVG 내부 범례 추가 (우측 하단)
        const legend = svg.append("g")
          .attr("class", "legend")
          .attr("transform", `translate(${width - 200}, ${height - 190})`);

        // 범례 배경
        legend.append("rect")
          .attr("class", "legend-box")
          .attr("width", 180)
          .attr("height", 170)
          .attr("x", 0)
          .attr("y", 0);

        // 범례 제목
        legend.append("text")
          .attr("class", "legend-title")
          .attr("x", 10)
          .attr("y", 18)
          .text("국가별 색상");

        legend.append("text")
          .attr("class", "legend-text")
          .attr("x", 10)
          .attr("y", 32)
          .style("font-size", "9px")
          .text("(마커 & 화살표)");

        // 화살표 및 마커 범례 (국가별)
        const arrowLegends = [
          { country: "USA", label: "미국", y: 50 },
          { country: "UK", label: "영국", y: 65 },
          { country: "EU", label: "유럽", y: 80 },
          { country: "China", label: "중국", y: 95 },
          { country: "Japan", label: "일본", y: 110 },
          { country: "Korea", label: "한국", y: 125 }
        ];

        arrowLegends.forEach(item => {
          // 마커 (원)
          legend.append("circle")
            .attr("cx", 15)
            .attr("cy", item.y)
            .attr("r", 4)
            .attr("fill", countryColors[item.country])
            .attr("stroke", "white")
            .attr("stroke-width", 1.5);

          // 화살표 (선)
          legend.append("line")
            .attr("x1", 23)
            .attr("y1", item.y)
            .attr("x2", 38)
            .attr("y2", item.y)
            .attr("stroke", countryColors[item.country])
            .attr("stroke-width", 2)
            .attr("stroke-dasharray", "3,3");

          // 라벨
          legend.append("text")
            .attr("class", "legend-text")
            .attr("x", 43)
            .attr("y", item.y + 4)
            .text(item.label);
        });

        // 화살표 굵기 설명
        legend.append("text")
          .attr("class", "legend-text")
          .attr("x", 10)
          .attr("y", 153)
          .style("font-size", "9px")
          .style("font-style", "italic")
          .text("* 굵기 = 자금 이동 규모");

      })
      .catch(error => {
        console.error("Error loading map data:", error);
        d3.select("#loading").text("지도 데이터 로드 실패. 인터넷 연결을 확인하세요.");
      });

    // 테마 토글 기능
    const themeToggle = document.getElementById("theme-toggle");
    let isDark = false;

    themeToggle.addEventListener("click", () => {
      isDark = !isDark;
      document.body.classList.toggle("dark-theme");
      themeToggle.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";

      // 다크모드 시 화살표 및 마커 색상 업데이트
      if (isDark) {
        d3.selectAll(".flow-arrow").each(function(d, i) {
          const flow = flows[i];
          if (flow) {
            d3.select(this)
              .attr("stroke", countryColorsDark[flow.fromCountry])
              .style("stroke", countryColorsDark[flow.fromCountry]);
          }
        });
        d3.selectAll(".city-marker").each(function(d) {
          d3.select(this).attr("fill", countryColorsDark[d.country]);
        });
        // 범례 업데이트
        d3.selectAll(".legend circle").each(function(d, i) {
          const countries = ["USA", "UK", "EU", "China", "Japan", "Korea"];
          if (i < countries.length) {
            d3.select(this).attr("fill", countryColorsDark[countries[i]]);
          }
        });
        d3.selectAll(".legend line").each(function(d, i) {
          const countries = ["USA", "UK", "EU", "China", "Japan", "Korea"];
          if (i < countries.length) {
            d3.select(this).attr("stroke", countryColorsDark[countries[i]]);
          }
        });
      } else {
        d3.selectAll(".flow-arrow").each(function(d, i) {
          const flow = flows[i];
          if (flow) {
            d3.select(this)
              .attr("stroke", countryColors[flow.fromCountry])
              .style("stroke", countryColors[flow.fromCountry]);
          }
        });
        d3.selectAll(".city-marker").each(function(d) {
          d3.select(this).attr("fill", countryColors[d.country]);
        });
        // 범례 업데이트
        d3.selectAll(".legend circle").each(function(d, i) {
          const countries = ["USA", "UK", "EU", "China", "Japan", "Korea"];
          if (i < countries.length) {
            d3.select(this).attr("fill", countryColors[countries[i]]);
          }
        });
        d3.selectAll(".legend line").each(function(d, i) {
          const countries = ["USA", "UK", "EU", "China", "Japan", "Korea"];
          if (i < countries.length) {
            d3.select(this).attr("stroke", countryColors[countries[i]]);
          }
        });
      }
    });
  </script>
</body>
</html>
